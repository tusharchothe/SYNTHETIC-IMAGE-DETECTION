[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidetect"
version = "0.1.0"
description = "AI-generated image detector project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.6",
    "gradio>=4.0.0",
    "open_clip_torch>=2.20.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "Pillow>=9.0.0",
    "numpy>=1.22.0",
    "SQLAlchemy>=2.0.0",
    "mlflow>=2.10.0",
    "pytest",
    "httpx",
]

[project.scripts]
aidetect-train = "aidetect.cli:train"
aidetect-eval = "aidetect.cli:evaluate"
aidetect-predict = "aidetect.cli:predict"
aidetect-dataset = "v1.dataset_builder:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
